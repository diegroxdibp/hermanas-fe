<div class="page">
  <form (submit)="submit($event)" novalidate>
    <div class="form-header">
      <h2>Complete o seu perfil</h2>
      <p class="form-subhead">Estes dados ajudam o seu profissional a preparar a sessão.</p>
    </div>

    <div class="field">
      <label for="ob-name">Nome:</label>
      <input
        id="ob-name"
        type="text"
        [formControl]="nameCtrl"
        placeholder="Bruxo Voador da Silva"
        autocomplete="name"
      />
    </div>

    <div class="two-col">
      <div class="field">
        <label id="ob-birth-label">Data de nascimento:</label>
        <div class="field-wrap" (mousedown)="$event.stopPropagation()">
          <button
            type="button"
            class="filled-field"
            [class.open]="calendarOpen()"
            aria-labelledby="ob-birth-label"
            (mousedown)="toggleCalendar()"
          >
            <span class="field-value" [class.placeholder]="!birthdateCtrl.value">
              {{ selectedBirthdateLabel || 'dd/mm/aaaa' }}
            </span>
            <span class="material-symbols-outlined field-icon">calendar_today</span>
          </button>

          @if (calendarOpen()) {
            <div class="calendar-popover">
              <div class="sheet-handle" aria-hidden="true"></div>
              <div class="cal-header">
                <button type="button" class="cal-nav" (click)="prevMonth()">
                  <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <div class="cal-select-wrap">
                  <select class="cal-select" [value]="calMonthIndex" (change)="onMonthChange($any($event.target).value)">
                    @for (m of months; track m; let i = $index) {
                      <option [value]="i">{{ m }}</option>
                    }
                  </select>
                  <select class="cal-select" [value]="calYear" (change)="onYearChange($any($event.target).value)">
                    @for (y of years; track y) {
                      <option [value]="y">{{ y }}</option>
                    }
                  </select>
                </div>
                <button type="button" class="cal-nav" (click)="nextMonth()">
                  <span class="material-symbols-outlined">chevron_right</span>
                </button>
              </div>

              <div class="cal-weekdays">
                @for (wd of weekdays; track $index) {
                  <span class="cal-wd">{{ wd }}</span>
                }
              </div>

              <div class="cal-grid">
                @for (cell of calendarDays(); track cell.key) {
                  <button type="button"
                    class="cal-day"
                    [class.other-month]="!cell.inMonth"
                    [class.today]="isToday(cell.date)"
                    [class.selected]="birthdateCtrl.value === cell.key"
                    [disabled]="isOutOfRange(cell.key) || !cell.inMonth"
                    (click)="selectDate(cell.key)">
                    {{ cell.date.getDate() }}
                  </button>
                }
              </div>
            </div>
          }
        </div>
      </div>

      <div class="field">
        <label for="ob-gender">Gênero:</label>
        <div class="select-wrap">
          <select id="ob-gender" [formControl]="genderCtrl">
            <option value="" disabled>Selecione</option>
            @for (g of genders; track g) {
              <option [value]="g">{{ g }}</option>
            }
          </select>
          <span class="chev" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <div class="phone-row">
      <div class="field country-field">
        <label for="ob-country">País:</label>
        <div class="select-wrap">
          <select
            id="ob-country"
            [value]="selectedCountry.code"
            (change)="onCountryChange($any($event.target).value)"
          >
            @for (c of countries; track c.code) {
              <option [value]="c.code">{{ c.namePt }} (+{{ c.InternationalAreaCode }})</option>
            }
          </select>
          <span class="chev" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="field phone-field">
        <label for="ob-phone">Telefone:</label>
        <div class="phone-input-wrap">
          <span class="dial-code">+{{ selectedCountry.InternationalAreaCode }}</span>
          <input
            id="ob-phone"
            type="tel"
            [formControl]="phoneCtrl"
            [maskito]="phoneMask"
            placeholder="000 000 000"
            inputmode="numeric"
            pattern="[0-9]*"
          />
        </div>
      </div>
    </div>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <div class="actions">
      <button type="submit" class="btn-primary">Continuar</button>
    </div>
  </form>
</div>
