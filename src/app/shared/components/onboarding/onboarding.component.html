<div class="page">
  <form (submit)="submit($event)" novalidate>
    <div class="form-header">
      <h2>Complete o seu perfil</h2>
      <p class="form-subhead">Estes dados ajudam o seu profissional a preparar a sessão.</p>
    </div>

    <div class="field">
      <label for="ob-name">Nome:</label>
      <input
        id="ob-name"
        type="text"
        [formControl]="nameCtrl"
        placeholder="Bruxo Voador da Silva"
        autocomplete="name"
      />
    </div>

    <div class="two-col">
      <div class="field">
        <label id="ob-birth-label">Data de nascimento:</label>
        <app-birthdate-calendar [dateControl]="birthdateCtrl" labelId="ob-birth-label" />
      </div>

      <div class="field">
        <label id="ob-gender-label">Gênero:</label>
        <app-styled-select
          inputId="ob-gender"
          [options]="genderOptions"
          [value]="genderCtrl.value"
          (valueChange)="genderCtrl.setValue($event)"
        />
      </div>
    </div>

    <div class="phone-row">
      <div class="field country-field">
        <label id="ob-country-label">País:</label>
        <app-styled-select
          inputId="ob-country"
          [options]="countryOptions"
          [value]="selectedCountry().code"
          (valueChange)="onCountryChange($event)"
        />
      </div>

      <div class="field phone-field">
        <label for="ob-phone">Telefone:</label>
        <app-country-phone-field
          [country]="selectedCountry()"
          [phoneControl]="phoneCtrl"
          inputId="ob-phone"
          placeholder="912 345 678"
          (prefixCountryChange)="onPhonePrefixChange($event)"
        />
      </div>
    </div>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <div class="actions">
      <button type="submit" class="btn-primary">Continuar</button>
    </div>
  </form>
</div>
