<div class="styled-select-root" (mousedown)="$event.stopPropagation()">
  <button
    type="button"
    class="select-trigger"
    [class.open]="dropdownOpen()"
    [id]="inputId"
    (mousedown)="toggleDropdown($event)"
  >
    <span class="trigger-label" [class.placeholder]="!selectedOption">{{ selectedOption?.label ?? placeholder }}</span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  @if (dropdownOpen()) {
    <div class="select-dropdown">
      @for (o of options; track o.value) {
        <button
          type="button"
          class="select-option"
          [class.selected]="o.value === value"
          (mousedown)="select(o, $event)"
        >
          <span class="option-name">{{ o.label }}</span>
          @if (o.meta) {
            <span class="option-code">{{ o.meta }}</span>
          }
        </button>
      }
    </div>
  }
</div>
