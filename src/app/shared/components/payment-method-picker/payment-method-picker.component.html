<span class="picker-label" [id]="labelId()">Como quer pagar</span>

<div class="picker-options" role="radiogroup" [attr.aria-labelledby]="labelId()">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="picker-option"
      role="radio"
      [class.selected]="selected() === option.value"
      [attr.aria-checked]="selected() === option.value"
      [disabled]="disabled()"
      (click)="select(option.value)"
    >
      <span translate="no" class="material-symbols-outlined picker-radio">
        {{ selected() === option.value ? 'radio_button_checked' : 'radio_button_unchecked' }}
      </span>
      <span class="picker-name">{{ option.label }}</span>
    </button>
  }
</div>
