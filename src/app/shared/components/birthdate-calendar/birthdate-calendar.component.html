<div class="field-wrap">
  <div class="filled-field" [class.open]="calendarOpen()">
    <input
      type="text"
      class="field-input"
      [class.placeholder]="!dateControl.value"
      [attr.aria-labelledby]="labelId || null"
      [formControl]="typedControl"
      [maskito]="dateMask"
      placeholder="dd/mm/aaaa"
      autocomplete="off"
      inputmode="numeric"
    />
    <button
      type="button"
      class="field-icon-btn"
      [attr.aria-label]="calendarOpen() ? 'Fechar calendário' : 'Abrir calendário'"
      (click)="toggleCalendar()"
    >
      <span translate="no" class="material-symbols-outlined field-icon">calendar_today</span>
    </button>
  </div>

  @if (calendarOpen()) {
    <div class="calendar-popover">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="cal-header">
        <button type="button" class="cal-nav" (click)="prevMonth()">
          <span translate="no" class="material-symbols-outlined">chevron_left</span>
        </button>
        <div class="cal-select-wrap">
          <app-styled-select
            class="cal-select month-select"
            [options]="monthOptions"
            [value]="calMonthIndex.toString()"
            (valueChange)="onMonthChange($event)"
          />
          <app-styled-select
            class="cal-select year-select"
            [options]="yearOptions"
            [value]="calYear.toString()"
            searchPlaceholder="Buscar ano..."
            (valueChange)="onYearChange($event)"
          />
        </div>
        <button type="button" class="cal-nav" (click)="nextMonth()">
          <span translate="no" class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>

      <div class="cal-weekdays">
        @for (wd of weekdays; track $index) {
          <span class="cal-wd">{{ wd }}</span>
        }
      </div>

      <div class="cal-grid">
        @for (cell of calendarDays(); track cell.key) {
          <button type="button"
            class="cal-day"
            [class.other-month]="!cell.inMonth"
            [class.today]="isToday(cell.date)"
            [class.selected]="dateControl.value === cell.key"
            [disabled]="isOutOfRange(cell.key) || !cell.inMonth"
            (click)="selectDate(cell.key)">
            {{ cell.date.getDate() }}
          </button>
        }
      </div>
    </div>
  }
</div>
